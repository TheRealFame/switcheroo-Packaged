[package]
name = "switcheroo"
version = "2.5.2"
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
glib = "0.22"
gtk = { version = "0.11", package = "gtk4", features = ["gnome_50"] }
gtk-macros = { version = "0.11", package = "gtk4-macros" }
adw = { version = "0.9", package = "libadwaita", features = ["v1_9"] }
log = "0.4"
once_cell = "1.21"
pretty_env_logger = "0.5"
itertools = "0.14"
tokio = { version = "1.51", features = ["process", "rt", "rt-multi-thread"] }
futures = "0.3"
ashpd = { version = "0.13", features = ["open_uri"] }
tempfile = "3"
regex = "1.12"
rand = "0.10"
shared_child = "1.1"
fdlimit = "0.3"
derivative = "2.2"
async-channel = "2.5"
